<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GP Login | Kelly Technologies</title>
  <meta name="description" content="Authorized access to Kelly Technologies monitoring systems." />
<meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fcfcfc" />

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header class="site-header" id="top">
    <div class="container nav">
      <a class="brand" href="/" aria-label="Kelly Technologies">
        <img src="../assets/logo.svg" alt="Kelly Technologies" class="brand-logo" />
      </a>
      <a class="login-button gp-login is-current"
         href="/gp/"
         data-en="GP"
         data-zh="管理人">管理人</a>
      <a class="login-button lp-login is-placeholder"
         href="#"
         aria-disabled="true"
         data-en="LP"
         data-zh="投资人">投资人</a>
      <button type="button" class="lang-toggle" data-lang-toggle aria-label="Switch to English">EN</button>
    </div>
  </header>

  <main class="gp-page" data-page="gp-login">
    <section class="gp-access" data-tab="access" aria-labelledby="gp-page-title">
  <div class="container gp-access-inner">
    <header class="gp-intro" data-card="intro">
  <p class="section-eyebrow"
     data-cell="eyebrow"
     data-en="Authorized systems"
     data-zh="授权系统">授权系统</p>
  <h1 class="gp-title"
      id="gp-page-title"
      data-cell="title"
      data-en="GP Login"
      data-zh="管理人登入">管理人登入</h1>
  <p class="gp-lede"
     data-cell="description"
     data-en="Select a monitoring system. Each destination requires its own authenticated session."
     data-zh="请选择要访问的监控系统。每个系统均需独立验证登入。">
    请选择要访问的监控系统。每个系统均需独立验证登入。
  </p>
</header>

    <div class="gp-system-grid" aria-label="Monitoring systems">
      <a class="gp-system-card"
   data-card="operations"
   href="https://monitor.kellytec.io/algo3/operations/login?next=%2Falgo3%2Foperations"
   aria-label="Open ALGO3 Monitor Operations login">
  <div class="gp-system-card-head">
    <span class="gp-system-index" data-cell="index">01</span>
    <span class="gp-access-badge"
          data-cell="access"
          data-en="Protected access"
          data-zh="受保护访问">受保护访问</span>
  </div>
  <h2 class="gp-system-title"
      data-cell="title"
      data-en="ALGO3 Monitor<br>Operations"
      data-zh="ALGO3 监控台<br>运营">ALGO3 监控台<br>运营</h2>
  <p class="gp-system-description"
     data-cell="description"
     data-en="Execution operations, orders, positions and compute state."
     data-zh="查看执行运营、订单、持仓及计算状态。">
    查看执行运营、订单、持仓及计算状态。
  </p>
  <span class="gp-system-action" data-cell="action">
    <span data-en="Continue to login" data-zh="继续登入">继续登入</span>
    <svg class="gp-system-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M3.5 12.5 12.5 3.5M6 3.5h6.5V10" />
    </svg>
  </span>
</a>

      <a class="gp-system-card"
   data-card="data-availability"
   href="https://monitor.kellytec.io/algo3/data-availability/login?next=%2Falgo3%2Fdata-availability"
   aria-label="Open ALGO3 Monitor Data Availability login">
  <div class="gp-system-card-head">
    <span class="gp-system-index" data-cell="index">02</span>
    <span class="gp-access-badge"
          data-cell="access"
          data-en="Protected access"
          data-zh="受保护访问">受保护访问</span>
  </div>
  <h2 class="gp-system-title"
      data-cell="title"
      data-en="ALGO3 Monitor<br>Data Availability"
      data-zh="ALGO3 监控台<br>数据可用性">ALGO3 监控台<br>数据可用性</h2>
  <p class="gp-system-description"
     data-cell="description"
     data-en="Raw and standardized data readiness across trading sessions."
     data-zh="查看各交易日的原始及标准化数据就绪状态。">
    查看各交易日的原始及标准化数据就绪状态。
  </p>
  <span class="gp-system-action" data-cell="action">
    <span data-en="Continue to login" data-zh="继续登入">继续登入</span>
    <svg class="gp-system-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M3.5 12.5 12.5 3.5M6 3.5h6.5V10" />
    </svg>
  </span>
</a>
    </div>

    <aside class="gp-security-note" data-card="security-note" aria-label="Access notice">
  <span class="gp-security-mark" data-cell="mark" aria-hidden="true"></span>
  <p data-cell="notice"
     data-en="Authorized personnel only. Operations and Data Availability maintain independent authenticated sessions."
     data-zh="仅限获授权人员使用。运营监控与数据可用性监控分别维护独立的登入会话。">
    仅限获授权人员使用。运营监控与数据可用性监控分别维护独立的登入会话。
  </p>
  <a class="gp-return-link"
     data-cell="return"
     href="/"
     data-en="Return to kellytec.io"
     data-zh="返回 kellytec.io">返回 kellytec.io</a>
</aside>
  </div>
</section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-disclaimer"
         data-en='© <span id="year">2026</span> Kelly Technologies Limited. All rights reserved.'
         data-zh='© <span id="year">2026</span> Kelly Technologies Limited 版权所有'>
        © <span id="year">2026</span> Kelly Technologies Limited. All rights reserved.
      </p>
    </div>
  </footer>

  <script src="../assets/scripts/page_reveal.js" defer></script>
  <script src="../assets/scripts/language.js" defer></script>
  <script src="../assets/scripts/header_scroll.js" defer></script>
</body>
</html>
