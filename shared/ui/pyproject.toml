[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kellytec-ui"
version = "0.1.3"
description = "Kelly Technologies shared Page, Tab, Card and Cell presentation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["kellytec_ui*"]

[tool.setuptools.package-data]
kellytec_ui = ["templates/*.html", "generated/*", "static/**/*.css", "static/**/*.js", "static/*.svg", "static/fonts/*"]
